name: github_analytics
version: "1.0.0"
config-version: 2

require-dbt-version: ["=1.12.0"]
profile: github_analytics

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: target
clean-targets:
  - target
  - dbt_packages

models:
  github_analytics:
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging"]
    intermediate:
      +materialized: view
      +schema: intermediate
      +tags: ["intermediate"]
    marts:
      +materialized: view
      +schema: marts
      +tags: ["marts"]

seeds:
  github_analytics:
    repository_metric_config:
      +column_types:
        repository_id: bigint
        repository_full_name: text
        default_branch: text
        repository_timezone: text
        production_signal: text
        production_environment_names: text
        production_workflow_name: text
        incident_label: text
        rollback_label: text
        hotfix_label: text
        unplanned_rework_label: text
        definition_version: text

flags:
  require_generic_test_arguments_property: true
